[project]
name = "pdf-rag-system"
version = "1.0.0"
description = "PDF retrieval-augmented generation API on PostgreSQL + pgvector"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a PostgreSQL database with pgvector (set TEST_DATABASE_URL)",
]
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings at import time.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
